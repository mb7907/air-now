<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef3f6; --ink:#17232b; --muted:#5b6b75; --line:#cdd8de;
  --sky-top:#9cc9e4; --sky-bot:#e3eef4; --haze:#c89a5a; --band:#2f8f5b;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10171c; --ink:#e6edf1; --muted:#93a3ad; --line:#26333b;
    --sky-top:#1d3a50; --sky-bot:#14222c; --haze:#8a6634; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10171c; --ink:#e6edf1; --muted:#93a3ad; --line:#26333b;
  --sky-top:#1d3a50; --sky-bot:#14222c; --haze:#8a6634; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.45}
main{max-width:30rem;margin:0 auto;padding:1rem 1.1rem 2rem}

.sky{position:relative;overflow:hidden;border-radius:22px;
  background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));
  padding:1.6rem 1.4rem 1.4rem;min-height:19rem;display:flex;flex-direction:column;justify-content:flex-end}
.sky::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 110%,var(--haze),transparent 70%),
             linear-gradient(180deg,transparent,var(--haze));
  opacity:var(--haze-level,0);transition:opacity 1.2s ease}
.sky > *{position:relative;z-index:1}
.place{font-size:1rem;color:var(--ink);opacity:.8;margin:0 0 auto}
.car{display:block;width:min(100%,21rem);margin:1.2rem 0 0 auto;overflow:visible}
.car .shell{fill:#e2553f}
.car .glass{fill:rgba(255,255,255,.78)}
.car .tire{fill:#1d1f21}
.car .hub{fill:#cfd6da}
.car .pipe{fill:#6b7378}
.car .road{stroke:var(--ink);stroke-opacity:.25;stroke-width:2;stroke-dasharray:14 10;animation:road 1s linear infinite}
.vehicle{animation:bob .5s ease-in-out infinite alternate}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
.puff{fill:var(--smoke,#c8c8c4);transform-box:fill-box;transform-origin:center;opacity:0;
  animation:drift var(--dur,3s) ease-out infinite;animation-delay:calc(var(--dur,3s) * var(--k,0) * -1)}
.puff.off{display:none}
@keyframes drift{0%{transform:translate(0,0) scale(.4);opacity:0}
  15%{opacity:var(--puff-op,.5)}
  100%{transform:translate(-110px,-45px) scale(var(--grow,2));opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(-1.5px)}}
@keyframes road{to{stroke-dashoffset:24}}
.reading{display:flex;align-items:baseline;gap:.6rem;margin-top:.4rem}
.num{font-size:clamp(5rem,26vw,8rem);font-weight:800;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.unit{font-size:1rem;color:var(--ink);opacity:.75}
.band{display:inline-flex;align-items:center;gap:.5rem;margin-top:.9rem;font-weight:600;font-size:1.25rem}
.band i{width:.8rem;height:.8rem;border-radius:50%;background:var(--band)}
.advice{margin:.35rem 0 0;color:var(--ink);opacity:.85;max-width:26rem}

.details{margin:1.2rem .2rem 0;display:grid;grid-template-columns:1fr auto;row-gap:.55rem;column-gap:1rem}
.details dt{color:var(--muted)}
.details dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.4rem}
button{font:inherit;font-size:.95rem;border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:.6rem 1rem;border-radius:999px;cursor:pointer}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--band);outline-offset:2px}
.regions{display:none;gap:.4rem;flex-wrap:wrap;margin-top:.8rem}
.regions.show{display:flex}
.note{margin-top:1.6rem;font-size:.85rem;color:var(--muted)}
.msg{margin-top:1rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){
  .sky::after{transition:none}
  .vehicle,.wheel,.car .road{animation:none}
  .puff{animation:none;opacity:calc(var(--puff-op,.5) * (1 - var(--k,0) * .7));
    transform:translate(calc(var(--k,0) * -110px - 8px),calc(var(--k,0) * -45px)) scale(calc(.7 + var(--k,0) * var(--grow,2)))}
}
</style>
</head>
<body>
<main>
  <section class="sky" id="sky" aria-live="polite">
    <p class="place" id="place">Finding your location…</p>
    <svg class="car" id="car" viewBox="0 0 320 130" role="img" aria-label="A car puffing exhaust">
      <line class="road" x1="0" y1="121" x2="320" y2="121"/>
      <g id="smoke">
        <circle class="puff" cx="86" cy="95" r="9"/>
        <circle class="puff" cx="86" cy="95" r="9"/>
        <circle class="puff" cx="86" cy="95" r="9"/>
        <circle class="puff" cx="86" cy="95" r="9"/>
        <circle class="puff" cx="86" cy="95" r="9"/>
        <circle class="puff" cx="86" cy="95" r="9"/>
        <circle class="puff" cx="86" cy="95" r="9"/>
        <circle class="puff" cx="86" cy="95" r="9"/>
      </g>
      <g class="vehicle">
        <rect class="pipe" x="88" y="91" width="16" height="7" rx="2"/>
        <path class="shell" d="M100 102 L100 80 Q103 67 120 65 L150 62 Q168 40 196 40 L236 40 Q256 42 268 62 L292 66 Q308 70 308 86 L308 102 Z"/>
        <path class="glass" d="M160 62 Q172 47 194 47 L208 47 L208 62 Z"/>
        <path class="glass" d="M216 47 L234 47 Q249 49 259 62 L216 62 Z"/>
        <circle cx="301" cy="78" r="4" fill="#ffd76a"/>
        <g class="wheel"><circle class="tire" cx="142" cy="103" r="17"/><circle class="hub" cx="142" cy="103" r="7"/><rect class="tire" x="140.5" y="96" width="3" height="14"/></g>
        <g class="wheel"><circle class="tire" cx="266" cy="103" r="17"/><circle class="hub" cx="266" cy="103" r="7"/><rect class="tire" x="264.5" y="96" width="3" height="14"/></g>
      </g>
    </svg>
    <div class="reading"><span class="num" id="num">–</span><span class="unit" id="unit"></span></div>
    <div class="band" id="bandRow" hidden><i></i><span id="band"></span></div>
    <p class="advice" id="advice"></p>
  </section>

  <dl class="details" id="details"></dl>

  <div class="actions">
    <button class="primary" id="refresh">Refresh reading</button>
    <button id="pick">Choose a Singapore region</button>
  </div>
  <div class="regions" id="regions"></div>
  <p class="msg" id="msg"></p>

  <p class="note">Singapore readings come from NEA via data.gov.sg (PSI is the 24-hour figure; PM2.5 is the latest 1-hour figure). Outside Singapore, readings are modelled estimates from Open-Meteo. Updates every 15 minutes while open.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const SG = {latMin:1.15, latMax:1.48, lonMin:103.6, lonMax:104.1};
const REGIONS = ["central","north","south","east","west"];
let lastCoords = null, forcedRegion = null;

const PSI_BANDS = [
  [50,"Good","#2f8f5b","Normal activities."],
  [100,"Moderate","#c9a227","Normal activities for most people."],
  [200,"Unhealthy","#d9772b","Reduce prolonged or strenuous outdoor activity."],
  [300,"Very unhealthy","#b8402f","Avoid prolonged or strenuous outdoor activity."],
  [Infinity,"Hazardous","#7a2c5a","Minimise outdoor activity."]
];
const PM25_1H_BANDS = [
  [55,"Normal","#2f8f5b"],[150,"Elevated","#c9a227"],[250,"High","#d9772b"],[Infinity,"Very high","#b8402f"]
];
const US_AQI_BANDS = [
  [50,"Good","#2f8f5b","Air quality is satisfactory."],
  [100,"Moderate","#c9a227","Unusually sensitive people should limit long outdoor exertion."],
  [150,"Unhealthy for sensitive groups","#d9772b","Sensitive groups should reduce outdoor exertion."],
  [200,"Unhealthy","#c2502f","Everyone should reduce prolonged outdoor exertion."],
  [300,"Very unhealthy","#9b2f3f","Avoid prolonged outdoor exertion."],
  [Infinity,"Hazardous","#7a2c5a","Stay indoors where possible."]
];
const bandFor = (v, bands) => bands.find(b => v <= b[0]);

function setSmoke(level, label){
  const car = $("car");
  const puffs = car.querySelectorAll(".puff");
  const n = 2 + Math.round(level * (puffs.length - 2));
  puffs.forEach((p, i) => {
    p.classList.toggle("off", i >= n);
    p.style.setProperty("--k", (i / n).toFixed(3));
  });
  const g = Math.round(205 - level * 160);
  car.style.setProperty("--smoke", `rgb(${g + 8},${g},${Math.max(g - 12, 20)})`);
  car.style.setProperty("--puff-op", (0.3 + level * 0.6).toFixed(2));
  car.style.setProperty("--grow", (1.3 + level * 2.6).toFixed(2));
  car.style.setProperty("--dur", (3.4 - level * 1.6).toFixed(2) + "s");
  car.setAttribute("aria-label", label ? `A car puffing ${label.toLowerCase()} levels of exhaust` : "A car puffing exhaust");
}

function inSingapore(c){ return c && c.lat>=SG.latMin && c.lat<=SG.latMax && c.lon>=SG.lonMin && c.lon<=SG.lonMax; }
function pick(obj, keys){ for (const k of keys) if (obj && obj[k] !== undefined) return obj[k]; }

function show({place, value, unit, band, rows, scale}){
  $("place").textContent = place;
  $("num").textContent = Math.round(value);
  $("unit").textContent = unit;
  $("band").textContent = band[1];
  $("advice").textContent = band[3] || "";
  $("bandRow").hidden = false;
  document.documentElement.style.setProperty("--band", band[2]);
  $("sky").style.setProperty("--haze-level", Math.min(value/scale, 1).toFixed(2));
  setSmoke(Math.min(value/scale, 1), band[1]);
  const dl = $("details"); dl.innerHTML = "";
  rows.forEach(([k,v]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  });
  $("msg").textContent = "";
}

function nearestRegion(meta, c){
  let best = null, bestD = Infinity;
  (meta||[]).forEach(r => {
    const loc = pick(r, ["labelLocation","label_location"]) || {};
    if (!loc.latitude || r.name === "national") return;
    const d = (loc.latitude-c.lat)**2 + (loc.longitude-c.lon)**2;
    if (d < bestD){ bestD = d; best = r.name; }
  });
  return best || "central";
}

async function getJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error(url + " returned " + r.status);
  return r.json();
}

async function loadSingapore(c){
  const [psiRes, pmRes] = await Promise.all([
    getJSON("https://api-open.data.gov.sg/v2/real-time/api/psi"),
    getJSON("https://api-open.data.gov.sg/v2/real-time/api/pm25").catch(() => null)
  ]);
  const d = psiRes.data || psiRes;
  const item = (d.items||[])[0];
  if (!item) throw new Error("No PSI reading available right now.");
  const meta = pick(d, ["regionMetadata","region_metadata"]);
  const region = forcedRegion || nearestRegion(meta, c);
  const rd = item.readings || {};
  const psi = pick(pick(rd, ["psi_twenty_four_hourly","psiTwentyFourHourly"]), [region]);
  const pm24 = pick(pick(rd, ["pm25_twenty_four_hourly","pm25TwentyFourHourly"]), [region]);

  let pm1 = null;
  if (pmRes){
    const pd = pmRes.data || pmRes;
    const pi = (pd.items||[])[0];
    pm1 = pi && pick(pick(pi.readings||{}, ["pm25_one_hourly","pm25OneHourly"]), [region]);
  }
  const ts = pick(item, ["updatedTimestamp","update_timestamp","timestamp","date"]);
  const name = region.charAt(0).toUpperCase() + region.slice(1);
  const rows = [];
  if (pm1 != null){ const b = bandFor(pm1, PM25_1H_BANDS); rows.push(["PM2.5, 1-hour", `${pm1} µg/m³ · ${b[1]}`]); }
  if (pm24 != null) rows.push(["PM2.5, 24-hour", `${pm24} µg/m³`]);
  rows.push(["Region", name]);
  if (ts) rows.push(["Updated", new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})]);
  show({place:`${name} Singapore${forcedRegion ? "" : ", nearest station area"}`, value:psi, unit:"PSI (24-hr)",
        band:bandFor(psi, PSI_BANDS), rows, scale:250});
}

async function loadGlobal(c){
  const u = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${c.lat}&longitude=${c.lon}&current=pm2_5,pm10,us_aqi&timezone=auto`;
  const j = await getJSON(u);
  const cur = j.current || {};
  if (cur.pm2_5 == null) throw new Error("No reading available for this location.");
  const aqi = cur.us_aqi;
  const rows = [["PM2.5", `${cur.pm2_5} µg/m³`], ["PM10", `${cur.pm10} µg/m³`],
    ["Location", `${c.lat.toFixed(3)}, ${c.lon.toFixed(3)}`],
    ["Updated", cur.time ? new Date(cur.time).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "–"]];
  show({place:"Your location (modelled estimate)", value:aqi ?? cur.pm2_5, unit: aqi != null ? "US AQI" : "PM2.5 µg/m³",
        band:bandFor(aqi ?? cur.pm2_5, US_AQI_BANDS), rows, scale:250});
}

async function load(){
  $("msg").textContent = "Loading…";
  try{
    if (forcedRegion || inSingapore(lastCoords)) await loadSingapore(lastCoords || {lat:1.35, lon:103.82});
    else await loadGlobal(lastCoords);
  }catch(e){
    $("msg").textContent = `Couldn't load the live reading. This hosted page can't reach outside data sources; open the downloaded HTML file in a normal browser for live data.`;
  }
}

function locate(){
  if (!navigator.geolocation){ noLocation("This browser can't share location."); return; }
  $("place").textContent = "Finding your location…";
  navigator.geolocation.getCurrentPosition(
    p => { lastCoords = {lat:p.coords.latitude, lon:p.coords.longitude}; forcedRegion = null; load(); },
    () => noLocation("Location is off for this page. Pick a Singapore region instead."),
    {enableHighAccuracy:false, timeout:10000, maximumAge:300000}
  );
}
function noLocation(text){
  $("place").textContent = "Location unavailable";
  $("msg").textContent = text;
  $("regions").classList.add("show");
}

REGIONS.forEach(r => {
  const b = document.createElement("button");
  b.textContent = r.charAt(0).toUpperCase() + r.slice(1);
  b.onclick = () => { forcedRegion = r; load(); };
  $("regions").append(b);
});
$("pick").onclick = () => $("regions").classList.toggle("show");
$("refresh").onclick = () => lastCoords || forcedRegion ? load() : locate();

setSmoke(0.1);
locate();
setInterval(() => { if (lastCoords || forcedRegion) load(); }, 15*60*1000);
</script>
</body>
</html>
